<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предзаказ меню</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --coal: #120d0a;
  --coal-soft: #1d1510;
  --cream: #f6eee1;
  --gold: #e0a64b;
  --brass: #c69a3e;
  --ember: #d81420;
  --green: #5ddd8a;
  --smoke: #1f1612;
  --muted: #cbb9a6;
}

html, body {
  background: var(--coal);
  color: var(--cream);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  /* Hide scrollbar but keep scroll */
  scrollbar-width: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

body {
  padding: 0;
  padding-bottom: 52px;
}

/* ─── Category nav — compact 2-row grid ─── */
.cats {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px 10px;
  background: rgba(18, 13, 10, 0.96);
  border-bottom: 1px solid rgba(224, 166, 75, 0.12);
}

/* Категории — точно как fire-btn-outline + fire-btn-glow */
.cat-btn {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 7px 14px;
  border: 1px solid rgba(255, 130, 60, 0.5);
  border-radius: 999px;
  background: transparent;
  color: #f2e6d4;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: none;
  transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.cat-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 100%, rgba(255, 220, 120, 0.55), transparent 60%),
    radial-gradient(circle at 70% 110%, rgba(255, 110, 30, 0.55), transparent 65%);
  opacity: 0.18;
  animation: fire-flicker 2.4s infinite ease-in-out;
  z-index: 1;
  pointer-events: none;
}
.cat-btn:hover {
  transform: translateY(-1px);
  border-color: rgba(255, 130, 60, 1);
  background: rgba(255, 130, 60, 0.1);
  box-shadow: 0 0 20px rgba(216, 20, 32, 0.6), 0 0 8px rgba(255, 100, 30, 0.4);
}
.cat-btn:hover::before {
  opacity: 0.55;
}
.cat-btn:active {
  transform: translateY(0);
}
.cat-btn--active {
  border-color: rgba(255, 130, 60, 1);
  background: rgba(255, 130, 60, 0.12);
  box-shadow: 0 0 18px rgba(216, 20, 32, 0.5);
}
.cat-btn--active::before {
  opacity: 0.35;
}

/* ─── Grid ─── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 8px 10px;
  contain: layout style;
}

/* ─── Card ─── */
.card {
  border: 1px solid rgba(224, 166, 75, 0.14);
  border-radius: 10px;
  overflow: hidden;
  background: rgba(18, 13, 10, 0.6);
  display: grid;
  grid-template-rows: auto 1fr;
  contain: layout style;
}

.card__img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: rgba(224, 166, 75, 0.05);
}

.card__noimg {
  width: 100%;
  aspect-ratio: 16/9;
  background: rgba(224, 166, 75, 0.05);
}

.card__body {
  padding: 6px 8px 8px;
  display: grid;
  gap: 2px;
  align-content: start;
}

.card__title {
  font-size: 11px;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.3;
  word-break: keep-all;
  hyphens: none;
}

.card__weight {
  font-size: 10px;
  color: var(--muted);
}

.card__desc {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__price {
  font-size: 12px;
  font-weight: 800;
  color: var(--gold);
}

/* ─── «Добавить» кнопка — точно как fire-btn-outline + fire-btn-glow ─── */
.card__add {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  margin-top: 6px;
  padding: 8px 14px;
  min-height: 34px;
  border: 1px solid rgba(255, 130, 60, 0.5);
  border-radius: 999px;
  background: transparent;
  color: #f2e6d4;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: none;
  transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.card__add::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 100%, rgba(255, 220, 120, 0.55), transparent 60%),
    radial-gradient(circle at 70% 110%, rgba(255, 110, 30, 0.55), transparent 65%);
  opacity: 0.18;
  animation: fire-flicker 2.4s infinite ease-in-out;
  z-index: 1;
  pointer-events: none;
}
.card__add:hover {
  transform: translateY(-1px);
  border-color: rgba(255, 130, 60, 1);
  background: rgba(255, 130, 60, 0.1);
  box-shadow: 0 0 20px rgba(216, 20, 32, 0.6), 0 0 8px rgba(255, 100, 30, 0.4);
}
.card__add:hover::before {
  opacity: 0.55;
}
.card__add:active {
  transform: translateY(0);
}

/* ─── Qty stepper — 1:1 с .dish-qty из MenuPage ─── */
.card__qty {
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px;
  border: 1px solid rgba(255, 130, 60, 0.5);
  border-radius: 999px;
  background: rgba(20, 14, 10, 0.7);
}
.card__qty button {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  min-height: 28px;
  padding: 0;
  border: 1px solid rgba(255, 130, 60, 0.5);
  border-radius: 999px;
  color: rgba(255, 130, 60, 1);
  background: transparent;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: none;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.2s ease;
}
.card__qty button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 100%, rgba(255, 220, 120, 0.6), transparent 65%);
  opacity: 0;
  transition: opacity 0.2s ease;
  z-index: 1;
  pointer-events: none;
  border-radius: inherit;
}
.card__qty button:hover {
  transform: translateY(-1px);
  border-color: rgba(255, 130, 60, 1);
  background: rgba(255, 130, 60, 0.1);
  box-shadow: 0 0 16px rgba(216, 20, 32, 0.65), 0 0 6px rgba(255, 100, 30, 0.4);
}
.card__qty button:hover::before {
  opacity: 0.45;
}
.card__qty button:active {
  transform: translateY(0);
}
.card__qty span {
  min-width: 20px;
  padding: 0 4px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 900;
  color: var(--cream);
}

@keyframes fire-flicker {
  0%, 100% { opacity: 0.18; transform: translateY(0); }
  50% { opacity: 0.35; transform: translateY(-1px); }
}

/* ─── Fire ripple + sparks при клике — 1:1 с FireButton ─── */
.fire-ripple {
  position: absolute;
  left: var(--rx);
  top: var(--ry);
  transform: translate(-50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 220, 140, 0.95), rgba(255, 100, 40, 0.65) 40%, transparent 70%);
  pointer-events: none;
  z-index: 3;
  animation: fire-ripple 0.7s cubic-bezier(0.22, 0.8, 0.4, 1) forwards;
}

.fire-spark {
  position: absolute;
  left: var(--rx);
  top: var(--ry);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe6a8 0%, #ff8a3a 60%, transparent 100%);
  pointer-events: none;
  z-index: 3;
  animation: fire-spark 0.7s cubic-bezier(0.22, 0.8, 0.4, 1) forwards;
  animation-delay: var(--delay, 0ms);
}

@keyframes fire-ripple {
  0% { width: 6px; height: 6px; opacity: 1; }
  60% { opacity: 0.8; }
  100% { width: 200px; height: 200px; opacity: 0; }
}

@keyframes fire-spark {
  0% {
    transform: translate(-50%, -50%) translate(0, 0);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) translate(var(--dx, 40px), var(--dy, -20px));
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card__add::before { animation: none; }
  .cat-btn::before { animation: none; }
  .fire-ripple { animation: none; opacity: 0; }
  .fire-spark { animation: none; opacity: 0; }
}

/* ─── Total bar ─── */
.total-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 8px 12px;
  background: rgba(18, 13, 10, 0.97);
  border-top: 1px solid rgba(224, 166, 75, 0.18);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.total-bar__label {
  font-size: 12px;
  font-weight: 800;
  color: var(--green);
}
.total-bar__count {
  font-size: 11px;
  color: var(--muted);
}
.total-bar--hidden {
  display: none;
}

/* ─── Loading / Error ─── */
.status {
  padding: 32px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 360px) {
  .grid { gap: 4px; padding: 6px; }
  .cat-btn { padding: 4px 8px; font-size: 10px; }
}
</style>
</head>
<body>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="total-bar total-bar--hidden" id="total-bar">
  <span class="total-bar__label" id="total-label">0 ₽</span>
  <span class="total-bar__count" id="total-count"></span>
</div>

<script>
(function() {
  'use strict';

  var categories = [];
  var activeCategory = 0;
  var selected = {};
  var prices = {};

  var catsEl = document.getElementById('cats');
  var gridEl = document.getElementById('grid');
  var totalBar = document.getElementById('total-bar');
  var totalLabel = document.getElementById('total-label');
  var totalCount = document.getElementById('total-count');

  /* ─── Fetch menu ─── */
  fetch('/api/menu')
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!Array.isArray(data) || data.length === 0) throw new Error('empty');
      categories = data.map(function(cat) {
        return {
          name: cat.name,
          items: (cat.items || []).filter(function(it) { return it.available !== false && it.available !== 0; })
        };
      }).filter(function(cat) { return cat.items.length > 0; });
      renderCats();
      renderGrid();
    })
    .catch(function(err) {
      gridEl.innerHTML = '<div class="status">\u041D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C \u043C\u0435\u043D\u044E</div>';
      console.warn('[booking-menu] fetch error:', err);
    });

  /* ─── Render categories ─── */
  function renderCats() {
    var frag = document.createDocumentFragment();
    categories.forEach(function(cat, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-btn' + (i === activeCategory ? ' cat-btn--active' : '');
      btn.textContent = cat.name;
      btn.onclick = function() {
        activeCategory = i;
        renderCats();
        renderGrid();
      };
      frag.appendChild(btn);
    });
    catsEl.innerHTML = '';
    catsEl.appendChild(frag);
  }

  /* ─── Render grid ─── */
  function renderGrid() {
    if (!categories.length) return;
    var items = categories[activeCategory].items;
    var frag = document.createDocumentFragment();

    items.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'card';

      if (item.image) {
        var img = document.createElement('img');
        img.className = 'card__img';
        img.src = item.image;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        card.appendChild(img);
      } else {
        var noimg = document.createElement('div');
        noimg.className = 'card__noimg';
        card.appendChild(noimg);
      }

      var body = document.createElement('div');
      body.className = 'card__body';

      var title = document.createElement('div');
      title.className = 'card__title';
      title.textContent = item.title;
      body.appendChild(title);

      if (item.weight) {
        var weight = document.createElement('div');
        weight.className = 'card__weight';
        weight.textContent = item.weight;
        body.appendChild(weight);
      }

      if (item.description) {
        var desc = document.createElement('div');
        desc.className = 'card__desc';
        desc.textContent = item.description;
        body.appendChild(desc);
      }

      var price = document.createElement('div');
      price.className = 'card__price';
      price.textContent = fmtPrice(item.price) + ' \u20BD';
      body.appendChild(price);

      prices[item.title] = item.price;

      var qty = selected[item.title] || 0;
      if (qty > 0) {
        body.appendChild(mkQty(item.title, qty));
      } else {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'card__add';
        addBtn.textContent = '\u0414\u043E\u0431\u0430\u0432\u0438\u0442\u044C';
        addBtn.onclick = (function(t, p) { return function() { addItem(t, p); }; })(item.title, item.price);
        body.appendChild(addBtn);
      }

      card.appendChild(body);
      frag.appendChild(card);
    });

    gridEl.innerHTML = '';
    gridEl.appendChild(frag);
  }

  /* ─── Qty control ─── */
  function mkQty(title, qty) {
    var wrap = document.createElement('div');
    wrap.className = 'card__qty';

    var minus = document.createElement('button');
    minus.type = 'button';
    minus.textContent = '\u2212';
    minus.onclick = function() { removeItem(title); };

    var span = document.createElement('span');
    span.textContent = String(qty);

    var plus = document.createElement('button');
    plus.type = 'button';
    plus.textContent = '+';
    plus.onclick = function() { addItem(title, prices[title]); };

    wrap.appendChild(minus);
    wrap.appendChild(span);
    wrap.appendChild(plus);
    return wrap;
  }

  /* ─── Actions ─── */
  function addItem(title, price) {
    selected[title] = (selected[title] || 0) + 1;
    prices[title] = price;
    updateCard(title);
    updateTotal();
    notifyParent();
  }

  function removeItem(title) {
    if (selected[title] > 1) {
      selected[title]--;
    } else {
      delete selected[title];
    }
    updateCard(title);
    updateTotal();
    notifyParent();
  }

  /* ─── Точечное обновление одной карточки (без перерисовки всего грида) ─── */
  function updateCard(title) {
    var cards = gridEl.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var titleEl = card.querySelector('.card__title');
      if (!titleEl || titleEl.textContent !== title) continue;
      var body = card.querySelector('.card__body');
      /* Удаляем старую кнопку/qty */
      var oldAdd = body.querySelector('.card__add');
      var oldQty = body.querySelector('.card__qty');
      if (oldAdd) oldAdd.remove();
      if (oldQty) oldQty.remove();
      /* Вставляем новую */
      var qty = selected[title] || 0;
      if (qty > 0) {
        body.appendChild(mkQty(title, qty));
      } else {
        var addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'card__add';
        addBtn.textContent = '\u0414\u043E\u0431\u0430\u0432\u0438\u0442\u044C';
        addBtn.onclick = (function(t, p) { return function() { addItem(t, p); }; })(title, prices[title]);
        body.appendChild(addBtn);
      }
      break;
    }
  }

  /* ─── Total ─── */
  function updateTotal() {
    var sum = 0;
    var count = 0;
    var keys = Object.keys(selected);
    for (var i = 0; i < keys.length; i++) {
      var t = keys[i];
      var q = selected[t];
      sum += (prices[t] || 0) * q;
      count += q;
    }
    if (sum > 0) {
      totalBar.classList.remove('total-bar--hidden');
      totalLabel.textContent = '\u041F\u0440\u0435\u0434\u0437\u0430\u043A\u0430\u0437: ' + fmtPrice(sum) + ' \u20BD';
      totalCount.textContent = count + ' \u043F\u043E\u0437.';
    } else {
      totalBar.classList.add('total-bar--hidden');
    }
  }

  /* ─── Notify parent (postMessage) ─── */
  function notifyParent() {
    if (!window.parent || window.parent === window) return;
    window.parent.postMessage({ type: 'booking-menu-update', selected: selected, prices: prices }, '*');
  }

  /* ─── Listen for parent messages (restore state) ─── */
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'booking-menu-restore') return;
    if (e.data.selected) {
      selected = e.data.selected;
      prices = e.data.prices || prices;
      renderGrid();
      updateTotal();
    }
  });

  /* ─── Fire ripple + sparks effect (1:1 с FireButton) ─── */
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fireEffect(btn, e) {
    if (reducedMotion) return;
    var rect = btn.getBoundingClientRect();
    var x = (e && e.clientX != null) ? e.clientX - rect.left : rect.width / 2;
    var y = (e && e.clientY != null) ? e.clientY - rect.top : rect.height / 2;

    var ripple = document.createElement('span');
    ripple.className = 'fire-ripple';
    ripple.style.setProperty('--rx', x + 'px');
    ripple.style.setProperty('--ry', y + 'px');
    btn.appendChild(ripple);
    setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 700);

    for (var i = 0; i < 6; i++) {
      var spark = document.createElement('span');
      spark.className = 'fire-spark';
      var angle = Math.random() * Math.PI - Math.PI / 2;
      var distance = 20 + Math.random() * 35;
      spark.style.setProperty('--rx', x + 'px');
      spark.style.setProperty('--ry', y + 'px');
      spark.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
      spark.style.setProperty('--dy', (Math.sin(angle) * distance - 15) + 'px');
      spark.style.setProperty('--delay', (Math.random() * 60) + 'ms');
      btn.appendChild(spark);
      setTimeout(function(s) { return function() { if (s.parentNode) s.remove(); }; }(spark), 800);
    }
  }

  /* ─── Делегирование через pointerdown — срабатывает ДО изменения DOM ─── */
  document.addEventListener('pointerdown', function(e) {
    var btn = e.target.closest('.card__add, .card__qty button, .cat-btn');
    if (btn) fireEffect(btn, e);
  });

  /* ─── Helpers ─── */
  function fmtPrice(n) { return new Intl.NumberFormat('ru-RU').format(n); }

})();
</script>
</body>
</html>
